org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# The Home's version; scripts/release.sh bumps both.
homeVersionName=0.4.13
homeVersionCode=24
# The FMTV Controller page this Home serves: a release of free-my-tv-remote-controller and its
# zip's SHA-256, both printed by that repository's scripts/release.sh (its ADR 0002). Empty, the
# Home is built without the page. -PwebRemoteZip=<path> builds with a local zip instead, unchecked.
webRemoteVersion=
webRemoteSha256=
